version: '3.9'

# Full stack: Postgres, Redis, API, worker, Next.js BFF.
# API: http://localhost:3000  |  Web (Next): http://localhost:3001
# Set WHATSAPP_* for real Meta traffic; template sync uses Graph API (same as send path).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      JWT_SECRET: ${JWT_SECRET:-change-me}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-compose-local-wa-token-not-for-real-api}
      WHATSAPP_GRAPH_BASE: ${WHATSAPP_GRAPH_BASE:-https://graph.facebook.com}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v20.0}
      WHATSAPP_DEFAULT_PHONE_NUMBER_ID: ${WHATSAPP_DEFAULT_PHONE_NUMBER_ID:-111}
      WHATSAPP_TENANT_PHONE_MAP: ${WHATSAPP_TENANT_PHONE_MAP:-{"111":"tenant-1"}}
      # Optional: non-Graph mock that implements GET .../message_templates
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "node dist/main.js"

  web:
    build:
      context: ../whaterakt_frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://api:3000
    ports:
      - "3001:3000"
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      TYPEORM_MIGRATIONS_RUN: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-compose-local-wa-token-not-for-real-api}
      WHATSAPP_GRAPH_BASE: ${WHATSAPP_GRAPH_BASE:-https://graph.facebook.com}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v20.0}
      WHATSAPP_DEFAULT_PHONE_NUMBER_ID: ${WHATSAPP_DEFAULT_PHONE_NUMBER_ID:-111}
      WHATSAPP_TENANT_PHONE_MAP: ${WHATSAPP_TENANT_PHONE_MAP:-{"111":"tenant-1"}}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "node dist/worker.js"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
